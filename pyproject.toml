[project]
name = "verigate"
version = "0.1.0"
description = "Runtime verification layer for agent claims: check output against evidence before it ships."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verigate*"]
